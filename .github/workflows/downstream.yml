name: downstream

# Projects use this repo at main, so a change here is tested against them before it merges
# (docs/contract.md): each project that declares a `downstream` receiver in projects/<name>.yaml runs its
# own CI and plan with this PR's commit as platform_ref (tools/downstream.py). One PR comment lists every
# project's result; a failed project fails this job, and `downstream` is a required check.
# It runs on every PR, and passes at once when the PR touches nothing a project can see (docs, runbooks).

on:
  pull_request:

permissions: {}

concurrency:
  group: downstream-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  downstream:
    name: downstream
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Forks get no OIDC token, so nothing of theirs can be sent to the projects.
      - name: Same-repo pull requests only
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::The downstream check can't run for a fork: push the branch to this repo."
          exit 1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Does the PR touch what projects use?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/changes.py | grep '^projects=' | tee -a "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.projects != 'true'
        run: echo "Nothing a project uses changed; no project was asked." | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.diff.outputs.projects == 'true'
        uses: ./.github/actions/vault-env
        with:
          addr: ${{ vars.VAULT_ADDR }}
          role: platform-plan
          secrets: |
            kv/data/platform/github-app app_id | GITHUB_APP_ID
            kv/data/platform/github-app private_key | GITHUB_APP_PRIVATE_KEY
      - id: app_token
        if: steps.diff.outputs.projects == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - if: steps.diff.outputs.projects == 'true'
        run: pip install 'PyYAML>=6,<7'
      - name: Run each project against this commit
        if: steps.diff.outputs.projects == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: python3 tools/downstream.py check --ref "$SHA" --comment "$RUNNER_TEMP/downstream.md"
      - name: Post the results on the PR
        if: ${{ !cancelled() && steps.diff.outputs.projects == 'true' && hashFiles('tools/pr_comment.sh') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f "$RUNNER_TEMP/downstream.md" ]]; then
            tools/pr_comment.sh '<!-- downstream-check -->' "$RUNNER_TEMP/downstream.md"
          fi
