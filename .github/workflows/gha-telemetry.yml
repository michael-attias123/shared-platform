name: gha-telemetry

# Turns one finished run of the caller's workflows into a trace and two gauges
# in the shared Grafana stack (tools/gha_trace.py). Call it from a workflow
# triggered by `workflow_run: completed`. Allow-listed attributes only: never
# the branch, commit, actor, names or emails. It prints counts only (public
# logs), and nothing in it can fail the run: telemetry never sends failure
# emails. The OTLP endpoint and headers come from the shared Vault.
# The caller's job needs contents: read, actions: read, id-token: write.

on:
  workflow_call:
    inputs:
      workflows:
        description: The workflow file names (without .yml) that become metric labels, comma-separated.
        type: string
        required: true
      vault-role:
        type: string
        required: true
      vault-secrets:
        description: >-
          vault-env lines exporting OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_EXPORTER_OTLP_HEADERS,
          e.g. `kv/data/<project>/platform/grafana ci_otlp_endpoint | OTEL_EXPORTER_OTLP_ENDPOINT`.
        type: string
        required: true
      service-name:
        type: string
        default: gha-telemetry
      platform-ref:
        type: string
        default: main

permissions: {}

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: michael-attias123/shared-platform
          ref: ${{ inputs.platform-ref }}
          path: .shared-platform
          persist-credentials: false
      - name: OTLP endpoint from the shared Vault
        id: vault
        continue-on-error: true
        uses: ./.shared-platform/.github/actions/vault-env
        with:
          addr: ${{ vars.VAULT_ADDR }}
          role: ${{ inputs.vault-role }}
          secrets: ${{ inputs.vault-secrets }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.vault.outcome == 'success'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .shared-platform/tools/requirements-telemetry.txt
      - if: steps.vault.outcome == 'success'
        continue-on-error: true
        run: pip install -r .shared-platform/tools/requirements-telemetry.txt
      - if: steps.vault.outcome == 'success'
        continue-on-error: true
        env:
          OTEL_SERVICE_NAME: ${{ inputs.service-name }}
          GHA_TRACE_WORKFLOWS: ${{ inputs.workflows }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python .shared-platform/tools/gha_trace.py
      - if: steps.vault.outcome != 'success'
        run: echo "::warning::No OTLP endpoint from Vault; no telemetry for this run."
