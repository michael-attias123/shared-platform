name: platform-check
run-name: Platform check ${{ inputs.platform_ref }}${{ inputs.report_to != '' && format(' (shared-platform#{0})', inputs.report_to) || '' }}

# This repo's own receiver of the downstream check, and the example for projects (docs/contract.md):
# shared-platform's downstream.yml starts it with the commit to test. It plans examples/consumer with the
# tools and modules at that commit and reports the plan's result as a notice titled `example plan`.
# A project's receiver looks the same, with its own CI jobs and stacks. The run name is how the caller
# finds the run. platform_ref runs that commit's tools here, so it is only ever a commit of this repo's
# own branches (downstream.yml refuses fork PRs).

on:
  workflow_dispatch:
    inputs:
      platform_ref:
        description: The shared-platform commit to test.
        type: string
        required: true
      report_to:
        description: The shared-platform PR number this check is for (only names the run).
        type: string
        default: ''

permissions: {}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/tofu-stack.yml
    with:
      dir: examples/consumer
      name: example
      mode: plan
      platform-ref: ${{ inputs.platform_ref }}

  report:
    name: report
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The plan's result
        env:
          EXITCODE: ${{ needs.plan.outputs.exitcode }}
          RESULT: ${{ needs.plan.result }}
        run: |
          [[ "$RESULT" == success ]] || { echo "::error::The plan of examples/consumer failed."; exit 1; }
          case "$EXITCODE" in
            0) msg="no changes" ;;
            2) msg="changes" ;;
            skip) msg="not planned: a provider was down" ;;
            *) msg="unknown ($EXITCODE)" ;;
          esac
          echo "::notice title=example plan::$msg"
